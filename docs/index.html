<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>AI 前沿周报</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>AI 前沿周报</h1>
          <p class="brand-sub">每周一更新 · 打勾、记录、沉淀成知识</p>
        </div>
      </div>
      <span id="mode-badge" class="badge" title="">只读</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="页面">
      <a role="tab" href="#week" data-tab="week">本周</a>
      <a role="tab" href="#archive" data-tab="archive">往期</a>
      <a role="tab" href="#learn" data-tab="learn">学习记录</a>
      <a role="tab" href="#knowledge" data-tab="knowledge">知识库</a>
      <a role="tab" href="#growth" data-tab="growth">成长</a>
      <a role="tab" href="#settings" data-tab="settings">设置</a>
    </nav>
  </header>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <main id="app">
    <section id="view-week" class="view" data-view="week" hidden></section>
    <section id="view-archive" class="view" data-view="archive" hidden></section>
    <section id="view-learn" class="view" data-view="learn" hidden></section>
    <section id="view-knowledge" class="view" data-view="knowledge" hidden></section>
    <section id="view-growth" class="view" data-view="growth" hidden></section>
    <section id="view-settings" class="view" data-view="settings" hidden></section>
  </main>

  <footer class="footer">
    <p>内容由 AI agent 每周自动检索和整理，每条都附原始链接，并标明是否读了原文。请以原文为准。</p>
  </footer>

  <script src="core.js"></script>
  <script src="charts.js"></script>
  <script src="views-week.js"></script>
  <script src="views-more.js"></script>
  <script src="app.js"></script>
</body>
</html>
